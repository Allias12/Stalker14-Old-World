- type: entity
  parent: EmergencyOxygenTank
  id: ExtendedEmergencyOxygenTankSTOW
  name: Small Oxygen tank
  suffix: STOW, Tank
  description: A small oxygen air tank, usually used only for the environment in the Zone. It's really compact and cheap. But it won’t protect you from a bad atmosphere for long.
  components:
  - type: Trash
    time: 300
  - type: Sprite
    sprite: _Stalker/Objects/Tools/Oxygentanks/emergency_extended_stalker.rsi
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
    sprite: _Stalker/Objects/Tools/Oxygentanks/emergency_extended_stalker.rsi
  - type: GasTank
    air:
      volume: 1.5
      temperature: 293.15
  - type: STWeight
    self: 2.25
  - type: Clothing
    sprite: _Stalker/Objects/Tools/Oxygentanks/emergency_extended_stalker.rsi

